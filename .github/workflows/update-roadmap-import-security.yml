name: Update MediaGallery import security roadmap

on:
  push:
    paths:
      - '.github/roadmap-import-security-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Update roadmap
        run: python tools/update_roadmap_import_security.py
      - name: Commit roadmap
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add ROADMAP.md
          git commit -m 'Document MediaGallery import security hardening'
          git push origin HEAD:modernize-1.8.0
