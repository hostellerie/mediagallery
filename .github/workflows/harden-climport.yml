name: Harden MediaGallery CLI import

on:
  push:
    paths:
      - '.github/climport-hardening-trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply CLI import hardening
        run: python tools/harden_climport_180.py
      - name: Validate CLI importer
        run: |
          php -l climport.php
          grep -n "Symbolic links are not imported\|_processDirectory(\$new_aid" climport.php
      - name: Commit CLI import hardening
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add climport.php
          git commit -m 'Harden recursive MediaGallery CLI imports'
          git push origin HEAD:modernize-1.8.0
