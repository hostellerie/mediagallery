name: Apply MediaGallery temporary cleanup patch

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/tmp-cleanup-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/tmp-cleanup-patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l include/lib-upload.php
          grep -q '@unlink($tmpPath);' include/lib-upload.php
          grep -q "if (\$tmpImage != '')" include/lib-upload.php

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/lib-upload.php ROADMAP.md IMPLEMENTATION_NOTES.md
          git commit -m 'Harden MediaGallery temporary upload cleanup'
          git push origin HEAD:modernize-1.8.0
