name: MediaGallery final template attribute audit

on:
  push:
    paths:
      - '.github/final-template-attribute-audit-trigger'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Audit dynamic template attributes
        run: python tools/final_template_attribute_audit_180.py
      - name: Close completed attribute escaping audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          old = '- [ ] Audit attribute escaping across all frame/theme variants.'
          new = '- [x] Audit attribute escaping across all frame/theme variants.'
          if text.count(old) != 1:
              raise SystemExit('Roadmap attribute-audit marker mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit roadmap closure
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add ROADMAP.md
          git commit -m 'Complete MediaGallery template attribute audit'
          git push origin HEAD:modernize-1.8.0
