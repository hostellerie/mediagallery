name: MediaGallery remaining public template modernization

on:
  push:
    paths:
      - '.github/modernize-remaining-public-trigger'

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply remaining public template modernization
        run: python tools/modernize_remaining_public_templates_180.py
      - name: Validate remaining public templates
        shell: bash
        run: |
          set -euo pipefail
          php -l public_html/view.php
          grep -n 'meta name="viewport"' templates/view_window.thtml templates/mp3_wmp.thtml
          grep -n 'meta name="robots" content="noindex,follow"' templates/view_window.thtml
          grep -n "'title'    => MG_escapeHTML" public_html/view.php
          grep -n 'mg_profile_table' templates/profile_album.thtml templates/profile_media.thtml
          grep -n '<nav class="mgThumbRow"' templates/thumbs.thtml
          grep -n 'mg_filelist_thumb' templates/filelist.thtml
          if grep -n 'swfobject.js' templates/view_window.thtml; then
            echo 'Obsolete SWFObject include remains in active popup' >&2
            exit 1
          fi
          if grep -n 'style="max-width:100%;width:' templates/mp3_wmp.thtml templates/mp3_podcast.thtml; then
            echo 'Fixed audio width remains' >&2
            exit 1
          fi
          if grep -n 'style="width:' templates/profile_album.thtml templates/profile_media.thtml templates/filelist.thtml; then
            echo 'Presentation width remains in profile/filelist fragment' >&2
            exit 1
          fi
      - name: Commit remaining public template modernization
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add public_html/view.php public_html/style.css templates ROADMAP.md
          git commit -m 'Modernize remaining MediaGallery public templates'
          git push origin HEAD:modernize-1.8.0
