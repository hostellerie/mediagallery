name: Fix MediaGallery JPEG fallback

on:
  push:
    paths:
      - '.github/fix-media-manage-jpg-180-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Patch JPEG fallback
        run: python3 .github/scripts/fix-media-manage-jpg-180.py
      - name: Validate and commit
        run: |
          php -l include/lib-media.php
          git diff --check
          rm -f .github/scripts/fix-media-manage-jpg-180.py
          rm -f .github/workflows/fix-media-manage-jpg-180.yml
          rm -f .github/fix-media-manage-jpg-180-trigger
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix MediaGallery JPEG fallback for multisite storage [skip ci]"
          git push origin HEAD:modernize-1.8.0
