name: Remove obsolete MediaGallery async upload handler

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/remove-legacy-upload-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply cleanup
        run: python3 .github/remove-legacy-upload.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l include/newmedia.php
          test ! -e public_html/upload.php
          ! grep -R -n --exclude-dir=.git --exclude-dir=.github 'MG_saveUpload(' .
          ! grep -R -n --exclude-dir=.git --exclude-dir=.github 'upload.php' include public_html package || true

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/newmedia.php ROADMAP.md IMPLEMENTATION_NOTES.md
          git commit -m 'Remove obsolete MediaGallery async upload handler'
          git push origin HEAD:modernize-1.8.0
