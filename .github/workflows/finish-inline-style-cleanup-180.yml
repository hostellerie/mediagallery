name: MediaGallery residual inline style cleanup

on:
  push:
    paths:
      - '.github/finish-inline-style-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Finish inline style cleanup
        run: python tools/finish_inline_style_cleanup_180.py
      - name: Validate residual inline styles
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_inline_styles_180.py | tee /tmp/inline-final.txt
          grep '^STATIC=0$' /tmp/inline-final.txt
          grep '^DYNAMIC=10$' /tmp/inline-final.txt
          grep -n 'residual inline-style utilities' public_html/style.css
          grep -n 'Review remaining inline presentation styles' ROADMAP.md | grep '\[x\]'
          grep -n 'Resolve all static inline presentation styles' ROADMAP.md
      - name: Commit residual inline style cleanup
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add -A templates public_html/frames public_html/style.css ROADMAP.md
          git commit -m 'Complete MediaGallery inline presentation cleanup'
          git push origin HEAD:modernize-1.8.0
