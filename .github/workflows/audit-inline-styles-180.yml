name: MediaGallery inline style audit

on:
  push:
    paths:
      - '.github/audit-inline-styles-trigger'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Audit inline styles
        run: python tools/audit_inline_styles_180.py
