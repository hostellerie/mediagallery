name: Retire MediaGallery MMS playback

on:
  push:
    paths:
      - '.github/playback-cleanup-trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Retire MMS playback
        run: python tools/retire_mms_playback_180.py
      - name: Validate playback cleanup
        run: |
          php -l include/lib-media.php
          if grep -n "preg_replace(.*mms\|mms_path" include/lib-media.php; then
            echo 'Legacy MMS URL generation remains' >&2
            exit 1
          fi
      - name: Commit playback cleanup
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add include/lib-media.php ROADMAP.md
          git commit -m 'Retire legacy MediaGallery MMS playback'
          git push origin HEAD:modernize-1.8.0
