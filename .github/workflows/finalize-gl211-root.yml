name: Finalize Geeklog 2.1.1 minimum and root album UI

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/gl211-root-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/finalize-gl211-root.py

      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          php -l autoinstall.php
          php -l public_html/index.php
          git diff --check

          rm -f .github/scripts/finalize-gl211-root.py
          rm -f .github/gl211-root-trigger

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Require Geeklog 2.1.1 and keep media out of root album [skip ci]'
          git push origin HEAD:modernize-1.8.0
