name: Update temporary MediaGallery upload trace gate

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/debug-upload-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Gate upload trace with MediaGallery verbose mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for filename in ('public_html/admin.php', 'include/newmedia.php'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              old = "!empty($_CONF['debug_image_upload'])"
              new = "!empty($_MG_CONF['verbose'])"
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'No debug_image_upload trace gate found in {filename}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{filename}: replaced {count} trace gate(s)')
          PY

      - name: Commit trace gate change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public_html/admin.php include/newmedia.php
          git commit -m 'Use MediaGallery verbose mode for upload trace'
          git push origin HEAD:modernize-1.8.0
