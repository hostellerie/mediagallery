name: MediaGallery accessibility closure

on:
  push:
    paths:
      - '.github/close-remaining-accessibility-trigger'

permissions:
  contents: write

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Close remaining accessibility gaps
        run: python tools/close_remaining_accessibility_180.py
      - name: Validate accessibility closure
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'aria-label="{lang_update}:' templates/global_album_attr.thtml
          grep -n 'id="mg-global-format-jpg"' templates/global_album_attr.thtml
          grep -n 'scope="col"' templates/global_album_attr.thtml templates/global_album_perm.thtml templates/createmembers.thtml templates/purgealbums.thtml templates/sessions.thtml
          grep -n '<label>{lang_group} {group_select}</label>' templates/global_album_perm.thtml
          grep -n 'aria-label="{lang_select}: {session_description}"' templates/sessions.thtml
          grep -n 'id="mg-watermark-file"' templates/wm_upload.thtml
          grep -n 'id="mg-watermark-description"' templates/wm_upload.thtml
          if grep -R -n 'onclick="javascript:doCheckAll_' templates/createmembers.thtml templates/purgealbums.thtml templates/sessions.thtml; then exit 1; fi
          grep -n 'Review keyboard accessibility and form labeling' ROADMAP.md | grep '\[x\]'
          grep -n 'global album-management update controls' ROADMAP.md
      - name: Commit accessibility closure
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add templates/global_album_attr.thtml templates/global_album_perm.thtml templates/createmembers.thtml templates/purgealbums.thtml templates/sessions.thtml templates/wm_upload.thtml ROADMAP.md
          git commit -m 'Complete MediaGallery form accessibility review'
          git push origin HEAD:modernize-1.8.0
