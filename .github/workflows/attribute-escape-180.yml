name: MediaGallery HTML attribute escaping

on:
  push:
    paths:
      - '.github/attribute-escape-trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply HTML escaping hardening
        run: python tools/attribute_escape_180.py
      - name: Validate changed PHP and templates
        shell: bash
        run: |
          set -euo pipefail
          php -l include/common.php
          php -l public_html/album.php
          grep -n "slideshow_onclick" include/common.php
          grep -n "MG_escapeHTML(.*mode=edit" public_html/album.php
          grep -R -n 'href="{url_slideshow}"{slideshow_onclick}' templates/album_page.thtml templates/themes/*/album_page.thtml
          if grep -R -n "#\\\" onclick=\\\"return openGallery1" include/common.php; then
            echo 'Legacy slideshow href injection remains' >&2
            exit 1
          fi
      - name: Commit HTML escaping hardening
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add include/common.php public_html/album.php templates/album_page.thtml templates/themes ROADMAP.md
          git commit -m 'Harden MediaGallery album action attributes'
          git push origin HEAD:modernize-1.8.0
