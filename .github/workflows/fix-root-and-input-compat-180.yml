name: Fix MediaGallery root and Geeklog 2.1.1 compatibility

on:
  push:
    paths:
      - '.github/fix-root-and-input-compat-180-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply compatibility patch
        run: python3 .github/scripts/fix-root-and-input-compat-180.py
      - name: Validate and commit
        run: |
          php -l include/input_compat_180.php
          php -l include/lib-upload.php
          git diff --check
          rm -f .github/scripts/fix-root-and-input-compat-180.py
          rm -f .github/workflows/fix-root-and-input-compat-180.yml
          rm -f .github/fix-root-and-input-compat-180-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden root uploads and Geeklog 2.1.1 input compatibility"
          git push origin modernize-1.8.0
