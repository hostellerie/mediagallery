name: MediaGallery final public markup

on:
  push:
    paths:
      - '.github/finalize-public-markup-trigger'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Finalize public markup
        run: python tools/finalize_public_markup_180.py
      - name: Validate public markup
        shell: bash
        run: |
          set -euo pipefail
          grep -n '<h1 class="mg_album_title">' templates/themes/podcast/album_page.thtml
          grep -n '<h2 class="mg-podcast-card-title">' templates/themes/podcast/album_page_media_cell.thtml
          grep -n '<h3 class="mg-podcast-card-subtitle">' templates/themes/podcast/album_page_media_cell.thtml
          grep -n 'class="mg-anchor-target"' templates/themes/podcast/album_page_media_cell.thtml
          ! grep -R -n '<a name="{media_id}"></a>' templates/themes/podcast
          ! grep -R -n '<h1>{media_title}</h1>\|<h1>{lang_album} {album_title}</h1>' templates/themes/podcast
          ! grep -n '<table' templates/enroll.thtml
          ! grep -n '<br{xhtml}><br{xhtml}>' templates/enroll.thtml
          grep -n 'alt="" class="mg-mb-half-em"' templates/wm_manage.thtml
          grep -n 'final public semantic markup' public_html/style.css
          grep -n 'Complete final public markup audit:' ROADMAP.md
      - name: Commit public markup modernization
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add templates/themes/podcast/album_page_album_cell.thtml templates/themes/podcast/album_page_body_album_cell_1.thtml templates/themes/podcast/album_page_media_cell.thtml templates/themes/podcast/album_page_body_media_cell_1.thtml templates/enroll.thtml templates/wm_manage.thtml public_html/style.css ROADMAP.md
          git commit -m 'Finalize MediaGallery public semantic markup'
          git push origin HEAD:modernize-1.8.0
