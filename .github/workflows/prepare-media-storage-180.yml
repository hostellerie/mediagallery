name: Prepare MediaGallery 1.8 storage tree

on:
  push:
    paths:
      - '.github/prepare-media-storage-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
      - name: Patch multisite storage initialization
        run: python .github/scripts/prepare-media-storage-180.py
      - name: Validate and commit
        run: |
          php -l include/config_180.php
          rm .github/scripts/prepare-media-storage-180.py
          rm .github/workflows/prepare-media-storage-180.yml
          rm .github/prepare-media-storage-trigger
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Initialize site-specific MediaGallery storage tree [skip ci]'
          git push origin HEAD:modernize-1.8.0
