name: Fix MediaGallery MP3 size return

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/mp3-size-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply fix
        run: python3 .github/scripts/fix-mp3-size-return.py
      - name: Remove temporary files
        run: rm -f .github/scripts/fix-mp3-size-return.py .github/workflows/fix-mp3-size-return.yml .github/mp3-size-trigger
      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix MP3 thumbnail size return variables'
          git push origin HEAD:modernize-1.8.0
