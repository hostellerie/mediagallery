name: MediaGallery playback form value hardening

on:
  push:
    paths:
      - '.github/harden-playback-form-values-trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply playback form value hardening
        run: python tools/harden_playback_form_values_180.py
      - name: Validate PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l include/mediamanage.php
          grep -n "MG_escapeHTML(\$playback_options\['bgcolor'\])" include/mediamanage.php
          grep -n "MG_escapeHTML(\$playback_options\['flashvars'\])" include/mediamanage.php
      - name: Commit playback form hardening
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add include/mediamanage.php ROADMAP.md
          git commit -m 'Harden MediaGallery legacy playback form values'
          git push origin HEAD:modernize-1.8.0
