name: MediaGallery form accessibility audit

on:
  push:
    paths:
      - '.github/audit-form-accessibility-trigger'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Audit form controls
        run: python tools/audit_form_accessibility_180.py
