name: Build MediaGallery installable archive

on:
  workflow_dispatch:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/dist-trigger'

permissions:
  contents: write

jobs:
  build-dist:
    name: Build and commit installable ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout modernize branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Build dist archive
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          ARCHIVE="mediagallery_1.8.0_2.1.1.zip"

          rm -rf package
          mkdir -p package/mediagallery dist

          # Keep only the single current installable archive in dist/.
          find dist -maxdepth 1 -type f \( -name 'mediagallery-*.zip' -o -name 'mediagallery_*.zip' -o -name '*.zip.sha256' \) -delete

          rsync -a ./ package/mediagallery/ \
            --exclude='.git/' \
            --exclude='.gitignore' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='package/' \
            --exclude='.idea/' \
            --exclude='tmp/'

          cat > package/mediagallery/BUILD_INFO.txt <<EOF
          MediaGallery 1.8.0 test archive
          Geeklog target: 2.1.1+
          Source branch: modernize-1.8.0
          Source commit: ${SOURCE_SHA}
          EOF

          (
            cd package
            zip -qr "../dist/${ARCHIVE}" mediagallery
          )

          # Verify archive integrity without keeping a separate checksum file.
          CHECKSUM="$(sha256sum "dist/${ARCHIVE}" | awk '{print $1}')"
          echo "Archive SHA-256: ${CHECKSUM}"

          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Verify installable archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "dist/${ARCHIVE}" >/dev/null
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/functions.inc'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/autoinstall.php'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/BUILD_INFO.txt'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/public_html/mediaobjects/generic.png'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/public_html/mediaobjects/missing.png'
          ! unzip -Z1 "dist/${ARCHIVE}" | grep -q '^mediagallery/.github/'
          ! unzip -Z1 "dist/${ARCHIVE}" | grep -q '^mediagallery/dist/'
          ! unzip -Z1 "dist/${ARCHIVE}" | grep -q '^mediagallery/.gitignore$'

          # Verify that the package contains the fresh-install/enable-state guard.
          unzip -p "dist/${ARCHIVE}" mediagallery/include/config_180.php \
            | grep -q "isset(\$_MG_CONF\['installed_version'\])"

          # Geeklog 2.2.2 validates every archive basename with
          # Geeklog\FileSystem::isValidFileName(): only A-Z, a-z, 0-9,
          # underscore, dot and hyphen are allowed; the name may not start or
          # end with a dot and may not contain two consecutive dots.
          python3 - <<'PY'
          import os
          import re
          import sys
          import zipfile

          archive = os.path.join('dist', os.environ['ARCHIVE'])
          invalid = []

          with zipfile.ZipFile(archive) as zf:
              for path in zf.namelist():
                  name = path.rstrip('/').rsplit('/', 1)[-1]
                  if not name:
                      continue
                  valid = (
                      not name.startswith('.')
                      and not name.endswith('.')
                      and '..' not in name
                      and re.fullmatch(r'[0-9A-Za-z_.-]+', name) is not None
                  )
                  if not valid:
                      invalid.append(path)

          if invalid:
              print('Unsafe archive filenames for Geeklog 2.2.2:')
              for path in invalid:
                  print(' - ' + path)
              sys.exit(1)
          PY

      - name: Commit archive to modernize-1.8.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/
          if git diff --cached --quiet; then
            echo 'No dist changes to commit.'
            exit 0
          fi
          git commit -m "Build mediagallery_1.8.0_2.1.1.zip for ${SOURCE_SHA} [skip ci]"
          git push origin HEAD:modernize-1.8.0
