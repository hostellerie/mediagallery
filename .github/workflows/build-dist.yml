name: Build MediaGallery installable archive

on:
  workflow_dispatch:
    inputs:
      version:
        description: Archive version label
        required: false
        default: ''
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/dist-trigger'
      - '.github/workflows/build-dist.yml'

permissions:
  contents: write

jobs:
  build-dist:
    name: Build and commit installable ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout modernize branch
        uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Build dist archive
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_SHA="$(git rev-parse HEAD)"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          VERSION="${{ inputs.version }}"
          if [ -z "${VERSION}" ]; then
            VERSION="1.8.0-test-${SHORT_SHA}"
          fi
          VERSION="${VERSION//[^0-9A-Za-z._-]/-}"
          ARCHIVE="mediagallery-${VERSION}.zip"

          rm -rf package
          mkdir -p package/mediagallery dist

          rsync -a ./ package/mediagallery/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='package/' \
            --exclude='.idea/' \
            --exclude='tmp/'

          (
            cd package
            zip -qr "../dist/${ARCHIVE}" mediagallery
          )

          (
            cd dist
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )

          echo "SOURCE_SHA=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Verify installable archive
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/functions.inc'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/autoinstall.php'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/public_html/mediaobjects/generic.png'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/public_html/mediaobjects/missing.png'
          ! unzip -Z1 "dist/${ARCHIVE}" | grep -q '^mediagallery/.github/'
          ! unzip -Z1 "dist/${ARCHIVE}" | grep -q '^mediagallery/dist/'
          (cd dist && sha256sum -c "${ARCHIVE}.sha256")

      - name: Keep only current test archive
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -name 'mediagallery-*.zip' ! -name "${ARCHIVE}" -delete
          find dist -maxdepth 1 -type f -name 'mediagallery-*.zip.sha256' ! -name "${ARCHIVE}.sha256" -delete

      - name: Commit archive to modernize-1.8.0
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/
          if git diff --cached --quiet; then
            echo 'No dist changes to commit.'
            exit 0
          fi
          git commit -m "Build installable MediaGallery archive for ${SOURCE_SHA} [skip ci]"
          git push origin HEAD:modernize-1.8.0

      - name: Remove obsolete dist-build branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/dist-build" || true
