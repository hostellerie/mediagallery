name: Build MediaGallery installable archive

on:
  workflow_dispatch:
    inputs:
      version:
        description: Archive version label
        required: false
        default: 1.8.0-dev
  push:
    branches:
      - dist-build

permissions:
  contents: read

jobs:
  build-dist:
    name: Build installable ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4

      - name: Build dist archive
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ inputs.version }}"
          if [ -z "${VERSION}" ]; then
            VERSION="1.8.0-test-${GITHUB_SHA::7}"
          fi
          VERSION="${VERSION//[^0-9A-Za-z._-]/-}"
          ARCHIVE="mediagallery-${VERSION}.zip"

          rm -rf dist package
          mkdir -p dist package/mediagallery

          # A checkout only contains tracked files, so public_html/mediaobjects/
          # is safe to include. Its tracked generic icons and placeholder assets
          # are required by MediaGallery, while user media are ignored by Git.
          rsync -a ./ package/mediagallery/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='package/' \
            --exclude='.idea/' \
            --exclude='.dist-trigger' \
            --exclude='tmp/'

          (
            cd package
            zip -qr "../dist/${ARCHIVE}" mediagallery
          )

          # Write a portable checksum that can be verified directly after the
          # GitHub artifact is extracted, without requiring a dist/ directory.
          (
            cd dist
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          )

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          echo "Created dist/${ARCHIVE}"
          unzip -l "dist/${ARCHIVE}" | head -80

      - name: Verify required install files
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/functions.inc'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/autoinstall.php'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/public_html/mediaobjects/generic.png'
          unzip -Z1 "dist/${ARCHIVE}" | grep -qx 'mediagallery/public_html/mediaobjects/missing.png'
          (cd dist && sha256sum -c "${ARCHIVE}.sha256")

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediagallery-dist-${{ github.run_number }}
          path: |
            dist/${{ env.ARCHIVE }}
            dist/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 14
