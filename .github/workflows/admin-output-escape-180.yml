name: MediaGallery admin output escaping

on:
  push:
    paths:
      - '.github/admin-output-escape-trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply admin output escaping
        run: python tools/admin_output_escape_180.py
      - name: Validate changed PHP
        shell: bash
        run: |
          set -euo pipefail
          php -l include/albumedit.php
          php -l admin/category.php
          grep -n "MG_escapeHTML(\$album->title)" include/albumedit.php
          grep -n "MG_escapeHTML(\$A\['cat_name'\])" admin/category.php
      - name: Commit admin output escaping
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add include/albumedit.php admin/category.php ROADMAP.md
          git commit -m 'Harden MediaGallery admin form output escaping'
          git push origin HEAD:modernize-1.8.0
