name: Audit MediaGallery PHP 8 legacy APIs

on:
  push:
    paths:
      - '.github/php83-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Scan MediaGallery-owned PHP for removed or deprecated APIs
        run: |
          echo '=== removed/legacy PHP APIs ==='
          grep -RInE --include='*.php' --include='*.inc' \
            '\b(each|create_function|mysql_[a-z_]+|split|spliti|ereg|eregi|mcrypt_[a-z_]+)\s*\(' \
            --exclude-dir='getid3' . || true
          echo '=== native strftime fallbacks ==='
          grep -RInE --include='*.php' --include='*.inc' '\b(strftime|gmstrftime)\s*\(' \
            --exclude-dir='getid3' . || true
          echo '=== legacy globals ==='
          grep -RInE --include='*.php' --include='*.inc' '\$(HTTP_[A-Z_]+|REMOTE_ADDR|PHP_SELF)\b' \
            --exclude-dir='getid3' . || true
          echo '=== dynamic-property candidates ==='
          grep -RInE --include='*.php' --include='*.inc' '\$this->[A-Za-z_][A-Za-z0-9_]*\s*=' \
            --exclude-dir='getid3' include public_html admin functions.inc functions_legacy.inc 2>/dev/null || true
