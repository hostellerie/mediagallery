name: Cleanup MediaGallery runtime path configuration

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/runtime-path-cleanup.trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Remove site-specific runtime paths from Configuration API defaults
        run: python3 .github/scripts/cleanup-runtime-path-config.py

      - name: Commit cleanup and remove one-shot files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/cleanup-runtime-path-config.py
          git rm .github/workflows/cleanup-runtime-path-config.yml
          git rm .github/runtime-path-cleanup.trigger
          git add install_defaults.php
          git commit -m 'Stop persisting MediaGallery runtime paths'
          git push origin HEAD:modernize-1.8.0
