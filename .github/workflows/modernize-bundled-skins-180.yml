name: MediaGallery bundled skin modernization

on:
  push:
    paths:
      - '.github/modernize-bundled-skins-trigger'

permissions:
  contents: write

jobs:
  modernize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Fix filelist helper navigation handling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/modernize_bundled_skins_180.py')
          text = p.read_text(encoding='utf-8')
          start_marker = "replace_once('templates/themes/filelist/album_page.thtml', '<div class=\"mg_navbar\">', '<nav class=\"mg_navbar\" aria-label=\"Album actions and pagination\">', 'filelist top navbar')"
          end_marker = "p.write_text(text, encoding='utf-8')\n\n# Podcast skin"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit('Filelist navigation helper block mismatch')
          replacement = """p = Path('templates/themes/filelist/album_page.thtml')
          text = p.read_text(encoding='utf-8')
          old_nav = '<div class=\"mg_navbar\">'
          if text.count(old_nav) != 2:
              raise SystemExit('Expected two filelist navbars, found %d' % text.count(old_nav))
          text = text.replace(old_nav, '<div class=\"mg_navbar\" role=\"navigation\" aria-label=\"Album navigation\">')
          p.write_text(text, encoding='utf-8')

          # Podcast skin"""
          text = text[:start] + replacement + text[end + len(end_marker):]
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply bundled skin modernization
        run: python tools/modernize_bundled_skins_180.py
      - name: Validate bundled skin markup
        shell: bash
        run: |
          set -euo pipefail
          grep -n '<h1 class="mg_album_title">' templates/themes/filelist/album_page.thtml templates/themes/podcast/album_page.thtml templates/themes/simpleviewer/album_page.thtml templates/themes/jquery_colorbox/album_page.thtml templates/themes/jquery_ad-gallery/album_page.thtml
          grep -n 'mg_table_scroll' templates/themes/filelist/album_page.thtml
          grep -n 'role="navigation" aria-label="Album navigation"' templates/themes/filelist/album_page.thtml
          grep -n 'mg_podcast_list' templates/themes/podcast/album_page.thtml templates/themes/podcast/album_page_body.thtml
          grep -n 'class="sv-container-wrapper"' templates/themes/simpleviewer/album_page.thtml
          if grep -n 'style="height:800px"' templates/themes/simpleviewer/album_page.thtml; then
            echo 'SimpleViewer fixed 800px height remains' >&2
            exit 1
          fi
          if grep -n '<h2 style="float:left' templates/themes/jquery_colorbox/album_page.thtml templates/themes/jquery_ad-gallery/album_page.thtml; then
            echo 'Legacy floated gallery heading remains' >&2
            exit 1
          fi
      - name: Commit bundled skin modernization
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add templates/themes public_html/style.css ROADMAP.md
          git commit -m 'Modernize MediaGallery bundled responsive skins'
          git push origin HEAD:modernize-1.8.0
