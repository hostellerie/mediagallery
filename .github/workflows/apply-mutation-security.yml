name: Apply MediaGallery mutation security hardening

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/mutation-security-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Harden media membership checks
        run: python3 .github/media-membership-hardening.py

      - name: Validate targeted files
        shell: bash
        run: |
          set -euo pipefail
          php -l include/batch.php
          php -l include/mediamanage.php
          php -l include/lib-media.php
          php -l public_html/admin.php
          grep -q 'refused deletion of media' include/batch.php
          grep -q 'refused move of media' include/batch.php
          grep -q 'ignored batch rotate media' include/batch.php
          grep -q 'ignored batch watermark media' include/batch.php
          grep -q 'ignored media-manager update for media' include/mediamanage.php
          grep -q 'ignored album cover media' include/mediamanage.php
          grep -q 'media edit rejected because media' include/mediamanage.php
          grep -q 'media edit save rejected because media' include/mediamanage.php
          grep -q 'rotate rejected because media' include/lib-media.php

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/batch.php include/mediamanage.php ROADMAP.md IMPLEMENTATION_NOTES.md
          git commit -m 'Bind MediaGallery mutations to album media membership'
          git push origin HEAD:modernize-1.8.0
