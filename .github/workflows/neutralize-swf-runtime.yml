name: Neutralize MediaGallery SWF runtime config

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/swf-runtime-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply runtime cleanup
        run: python3 .github/scripts/neutralize-swf-runtime.py
      - name: Remove temporary cleanup files
        run: rm -f .github/scripts/neutralize-swf-runtime.py .github/workflows/neutralize-swf-runtime.yml .github/swf-runtime-trigger
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Decouple legacy SWF fallbacks from removed config'
          git push origin HEAD:modernize-1.8.0
