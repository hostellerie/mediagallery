name: Fix MediaGallery system thumbnails

on:
  push:
    paths:
      - '.github/system-thumbnails.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Patch system thumbnail resolution
        run: python3 .github/scripts/fix-system-thumbnails.py

      - name: Commit patch and remove one-shot files
        run: |
          rm -f .github/scripts/fix-system-thumbnails.py
          rm -f .github/workflows/fix-system-thumbnails.yml
          rm -f .github/system-thumbnails.trigger
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Separate system thumbnails from multisite media storage"
          git push origin HEAD:modernize-1.8.0
