name: Modernize MediaGallery video routing

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/video-routing-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply asserted video routing cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('include/lib-media.php')
          text = p.read_text(encoding='utf-8', errors='surrogateescape')
          old = """        case 'video/mpeg' :
        case 'video/x-mpeg' :
        case 'video/x-mpeq2a' :
            if ($_MG_CONF['use_wmp_mpeg'] == 1) {
                $function = 'MG_displayASF';
                break;
            }
        case 'video/x-motion-jpeg' :
        case 'video/quicktime' :
        case 'video/x-qtc' :
        case 'video/x-m4v' :
            $function = 'MG_displayMOV';
            if ($media['media_mime_ext'] == 'mp4' &&
                isset($_MG_CONF['play_mp4_flv']) && $_MG_CONF['play_mp4_flv'] == true) {
                $function = 'MG_displayFLV';
            }
            break;
"""
          new = """        case 'video/mpeg' :
        case 'video/x-mpeg' :
        case 'video/x-mpeq2a' :
        case 'video/x-motion-jpeg' :
        case 'video/quicktime' :
        case 'video/x-qtc' :
        case 'video/x-m4v' :
            // MediaGallery 1.8 uses the HTML5 video renderer for MPEG/MOV/MP4.
            // Legacy WMP/Flash routing options are intentionally ignored.
            $function = 'MG_displayMOV';
            break;
"""
          if text.count(old) != 1:
              raise SystemExit('video routing block not found exactly once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8', errors='surrogateescape')

          p = Path('functions_legacy.inc')
          text = p.read_text(encoding='utf-8', errors='surrogateescape')
          old1 = """
/*
 * By default, Media Gallery plays MP4 video files as QuickTime
 * videos, using the QuickTime player.
 *
 * If you prefer to use the Flash Video Player for MP4 files,
 * set this value to true.
 *
 */
$_MG_CONF['play_mp4_flv'] = false;
//$_MG_CONF['play_mp4_flv'] = true;
"""
          old2 = """
/*
 * By default, Media Gallery will play MPEG videos with Apple's QuickTime
 * player. If you wish to use Microsoft's Windows Media Player instead,
 * set this variable to 1.
 */

$_MG_CONF['use_wmp_mpeg'] = 0;
"""
          if text.count(old1) != 1 or text.count(old2) != 1:
              raise SystemExit('legacy playback option blocks not found exactly once')
          text = text.replace(old1, '\n', 1).replace(old2, '\n', 1)
          p.write_text(text, encoding='utf-8', errors='surrogateescape')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/modernize-video-routing.yml .github/video-routing-trigger

      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Route MPEG and MP4 playback through HTML5 renderer'
          git push origin HEAD:modernize-1.8.0
