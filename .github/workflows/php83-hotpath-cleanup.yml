name: Apply MediaGallery PHP 8 hot-path cleanup

on:
  push:
    paths:
      - '.github/php83-cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply compatibility cleanup
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1, encoding='utf-8'):
              p = Path(path)
              text = p.read_text(encoding=encoding)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding=encoding)

          # classAlbum: remove an obsolete extra argument from the internal call contract.
          replace(
              'include/classAlbum.php',
              '            $this->loadFromDB($album_id, $groups);',
              '            $this->loadFromDB($album_id);'
          )

          # classMedia: initialize legacy thumbnail suffix, guard retired playback config,
          # avoid undefined properties/variables, and make dimension helpers resilient.
          replace(
              'include/classMedia.php',
              "    static public function getThumbPath($path, $tn_size)\n    {\n        switch ($tn_size) {",
              "    static public function getThumbPath($path, $tn_size)\n    {\n        $postfix = '';\n        switch ($tn_size) {"
          )
          replace(
              'include/classMedia.php',
              "                    switch ($player) {",
              "                    $new_y = 360;\n                    $new_x = 580;\n                    switch ($player) {"
          )
          replace(
              'include/classMedia.php',
              "                    $playback_options['height'] = $_MG_CONF['swf_height'];\n                    $playback_options['width']  = $_MG_CONF['swf_width'];",
              "                    $playback_options['height'] = isset($_MG_CONF['swf_height']) ? $_MG_CONF['swf_height'] : 320;\n                    $playback_options['width']  = isset($_MG_CONF['swf_width']) ? $_MG_CONF['swf_width'] : 480;"
          )
          replace(
              'include/classMedia.php',
              '$this->remote_media != 1',
              '$this->remote != 1'
          )
          replace(
              'include/classMedia.php',
              "                    if ($this->mime_type == 'video/x-flv' && $_MG_CONF['use_flowplayer'] != 1) {",
              "                    $use_flowplayer = isset($_MG_CONF['use_flowplayer']) ? $_MG_CONF['use_flowplayer'] : 0;\n                    if ($this->mime_type == 'video/x-flv' && $use_flowplayer != 1) {"
          )
          replace(
              'include/classMedia.php',
              "        list($newwidth, $newheight) = self::getImageWH($this->media_size[0], $this->media_size[1], $tn_width, $tn_height);",
              "        $media_size = (is_array($this->media_size) && isset($this->media_size[0], $this->media_size[1]))\n                    ? $this->media_size : array($tn_width, $tn_height);\n        list($newwidth, $newheight) = self::getImageWH($media_size[0], $media_size[1], $tn_width, $tn_height);"
          )
          replace(
              'include/classMedia.php',
              "        list($newwidth, $newheight) = self::getImageWH($this->media_size[0], $this->media_size[1], 100, 100);",
              "        $media_size = (is_array($this->media_size) && isset($this->media_size[0], $this->media_size[1]))\n                    ? $this->media_size : array(100, 100);\n        list($newwidth, $newheight) = self::getImageWH($media_size[0], $media_size[1], 100, 100);"
          )
          replace(
              'include/classMedia.php',
              "    static public function getImageWH($imgwidth, $imgheight, $maxwidth, $maxheight, $stretch=true)\n    {\n        if ($imgwidth > $maxwidth || $imgheight > $maxheight) {",
              "    static public function getImageWH($imgwidth, $imgheight, $maxwidth, $maxheight, $stretch=true)\n    {\n        $imgwidth = (int) $imgwidth;\n        $imgheight = (int) $imgheight;\n        $maxwidth = max(1, (int) $maxwidth);\n        $maxheight = max(1, (int) $maxheight);\n\n        if ($imgwidth < 1 || $imgheight < 1) {\n            return array($maxwidth, $maxheight);\n        }\n\n        if ($imgwidth > $maxwidth || $imgheight > $maxheight) {"
          )
          replace(
              'include/classMedia.php',
              "        $resolution_x = $FileInfo['video']['resolution_x'];\n        $resolution_y = $FileInfo['video']['resolution_y'];",
              "        $resolution_x = isset($FileInfo['video']['resolution_x']) ? $FileInfo['video']['resolution_x'] : 0;\n        $resolution_y = isset($FileInfo['video']['resolution_y']) ? $FileInfo['video']['resolution_y'] : 0;"
          )
          replace(
              'include/classMedia.php',
              "        if ($resolution_x != 0) {\n            $sql = \"UPDATE \" . $_TABLES['mg_media']\n                 . \" SET media_resolution_x=\" . intval($resolution_x)\n                     . \",media_resolution_y=\" . intval($resolution_y)\n                 . \" WHERE media_id='\" . DB_escapeString($I['media_id']) . \"'\";\n            DB_query($sql);\n        }\n\n",
              ''
          )
          replace(
              'include/classMedia.php',
              "                            if ($size < 8388608) {",
              "                            if ($size !== false && $size < 8388608) {"
          )

          # common.php: old global variable is undefined on modern PHP runtimes.
          replace(
              'include/common.php',
              '    $user_ip     = DB_escapeString($REMOTE_ADDR);',
              "    $user_ip     = DB_escapeString(isset($_SERVER['REMOTE_ADDR']) ? $_SERVER['REMOTE_ADDR'] : '');"
          )

          # FeedCreator is a legacy ISO-8859-1 source file. Preserve its bytes while
          # declaring a property that otherwise becomes dynamic under PHP 8.2.
          replace(
              'include/lib/feedcreator.class.php',
              '\tvar $xslStyleSheet = "";',
              '\tvar $xslStyleSheet = "";\n\tvar $cssStyleSheet = "";',
              encoding='latin-1'
          )

      - name: PHP syntax check
        run: |
          php -l include/classAlbum.php
          php -l include/classMedia.php
          php -l include/common.php
          php -l include/lib/feedcreator.class.php

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add include/classAlbum.php include/classMedia.php include/common.php include/lib/feedcreator.class.php
          git commit -m 'Reduce PHP 8 runtime warnings in MediaGallery hot paths'
          git push origin HEAD:modernize-1.8.0
