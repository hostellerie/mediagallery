name: Harden MediaGallery final mutation paths

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/final-mutation-hardening-trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Apply hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit('Expected block not found in ' + path)
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Batch controller: continuation/cancellation are mutations, so POST + CSRF only.
          p = Path('public_html/batch.php')
          text = p.read_text(encoding='utf-8')
          old = """$mode       = isset($_REQUEST['mode']) ? COM_applyFilter($_REQUEST['mode']) : '';
$session_id = isset($_GET['sid'])      ? COM_applyFilter($_GET['sid'])      : '';

if (empty($session_id)) {
    COM_redirect($_MG_CONF['site_url'] . '/index.php');
}
"""
          new = """$mode       = isset($_POST['mode']) ? COM_applyFilter($_POST['mode']) : '';
$session_id = isset($_POST['sid'])  ? COM_applyFilter($_POST['sid'])  : '';

if ($_SERVER['REQUEST_METHOD'] !== 'POST' || empty($session_id) || !SEC_checkToken()) {
    COM_errorLog('MediaGallery: rejected batch mutation because POST/CSRF validation failed.', 1);
    $display = COM_showMessageText($LANG_MG00['access_denied_msg']);
    $display = MG_createHTMLDocument($display);
    COM_output($display);
    exit;
}
"""
          if old not in text:
              raise SystemExit('batch.php request block not found')
          text = text.replace(old, new, 1)
          text = text.replace("""if (isset($_POST['refresh_rate'])) {
    $refresh_rate = COM_applyFilter($_POST['refresh_rate'], true);
} else if (isset($_GET['refresh'])) {
    $refresh_rate = COM_applyFilter($_GET['refresh'], true);
}

$item_limit = $_MG_CONF['def_item_limit'];
if (isset($_POST['item_limit'])) {
    $item_limit = COM_applyFilter($_POST['item_limit'], true);
} else if (isset($_GET['limit'])) {
    $item_limit = COM_applyFilter($_GET['limit'], true);
}
""", """if (isset($_POST['refresh_rate'])) {
    $refresh_rate = COM_applyFilter($_POST['refresh_rate'], true);
}

$item_limit = $_MG_CONF['def_item_limit'];
if (isset($_POST['item_limit'])) {
    $item_limit = COM_applyFilter($_POST['item_limit'], true);
}
""", 1)
          p.write_text(text, encoding='utf-8')

          # Batch progress: replace mutating GET/meta-refresh with an auto-submitted POST form.
          replace_once('include/lib-batch.php', """        $form_action = $_MG_CONF['site_url'] . '/batch.php?mode=continue&amp;sid=' . $session_id
                     . '&amp;refresh=' . $refresh_rate . '&amp;limit=' . $item_limit;
        $next_button = $LANG_MG01['next'];
        // create the meta tag for refresh
        $T->set_var(\"META\", '<meta http-equiv=\"refresh\" content=\"' . $refresh_rate . ';url=' . $form_action . '\"' . XHTML . '>');
""", """        $form_action = $_MG_CONF['site_url'] . '/batch.php';
        $next_button = $LANG_MG01['next'];
        // Continuation is a state-changing operation. Keep auto-progress, but submit
        // the protected POST form instead of mutating state through a GET refresh.
        $T->set_var(\"META\", '');
""")

          replace_once('include/lib-batch.php', """        'REFRESH_RATE'         => $refresh_rate,
        'S_BATCH_ACTION'       => $form_action
""", """        'REFRESH_RATE'         => $refresh_rate,
        'S_BATCH_ACTION'       => $form_action,
        'BATCH_MODE'           => 'continue',
        'SESSION_ID'           => $session_id,
        'gltoken_name'         => CSRF_TOKEN,
        'gltoken'              => SEC_createToken()
""")

          replace_once('include/lib-batch.php', """function MG_endSession($session_id)
{
    global $_TABLES;

    $session_id = DB_escapeString($session_id);
    DB_delete($_TABLES['mg_sessions'],      'session_id', $session_id);
    DB_delete($_TABLES['mg_session_items'], 'session_id', $session_id);
    DB_delete($_TABLES['mg_session_log'],   'session_id', $session_id);

    return true;
}
""", """function MG_endSession($session_id)
{
    global $_TABLES, $_USER;

    $session_id = COM_applyFilter($session_id);
    if ($session_id === '') {
        return false;
    }

    $escapedSessionId = DB_escapeString($session_id);
    $owner = DB_getItem($_TABLES['mg_sessions'], 'session_uid',
                        \"session_id='\" . $escapedSessionId . \"'\");
    if ($owner === '' || $owner === null) {
        return false;
    }
    if ((int) $owner !== (int) $_USER['uid'] && !SEC_hasRights('mediagallery.admin')) {
        COM_errorLog('MediaGallery: refused deletion of a batch session owned by another user.', 1);
        return false;
    }

    DB_delete($_TABLES['mg_sessions'],      'session_id', $escapedSessionId);
    DB_delete($_TABLES['mg_session_items'], 'session_id', $escapedSessionId);
    DB_delete($_TABLES['mg_session_log'],   'session_id', $escapedSessionId);

    return true;
}
""")

          p = Path('templates/batch_progress.thtml')
          text = p.read_text(encoding='utf-8')
          text = text.replace("""        if (ticker == 0) {
            document.form_batch_progress.submit_button.value = label;
            document.form_batch_progress.submit_button.disabled = true;
""", """        if (ticker == 0) {
            document.form_batch_progress.submit_button.value = label;
            document.form_batch_progress.submit_button.disabled = true;
            document.form_batch_progress.submit();
""", 1)
          marker = """<form name=\"form_batch_progress\" method=\"post\" action=\"{S_BATCH_ACTION}\" class=\"uk-form\">\n"""
          hidden = marker + """<input type=\"hidden\" name=\"mode\" value=\"{BATCH_MODE}\"{xhtml}>\n<input type=\"hidden\" name=\"sid\" value=\"{SESSION_ID}\"{xhtml}>\n<input type=\"hidden\" name=\"{gltoken_name}\" value=\"{gltoken}\"{xhtml}>\n"""
          if marker not in text:
              raise SystemExit('batch progress form marker not found')
          p.write_text(text.replace(marker, hidden, 1), encoding='utf-8')

          # The legacy batch-caption route has no shipped form and expects array fields
          # that no current template emits. Remove the orphaned mutation surface.
          p = Path('public_html/admin.php')
          text = p.read_text(encoding='utf-8')
          start = text.find("} elseif ($mode == $LANG_MG01['save_exit']) {")
          end = text.find("} elseif ($mode === 'create') {", start)
          if start < 0 or end < 0:
              raise SystemExit('orphan save_exit route not found')
          text = text[:start] + text[end:]
          p.write_text(text, encoding='utf-8')

          p = Path('include/batch.php')
          text = p.read_text(encoding='utf-8')
          start = text.find('\nfunction MG_batchCaptionSave(')
          if start < 0:
              raise SystemExit('MG_batchCaptionSave not found')
          # Function is the final function in this file.
          p.write_text(text[:start].rstrip() + '\n', encoding='utf-8')

          # Roadmap/testing documentation.
          p = Path('ROADMAP.md')
          text = p.read_text(encoding='utf-8')
          old = "- [ ] Continue audit of remaining caption/moderation/delete-session mutations before RC."
          new = "- [x] Remove the orphaned legacy batch-caption mutation; make batch continuation/cancellation POST+CSRF only and bind session deletion to the owning user (administrator override).\n- [ ] Complete the moderation-path audit before RC; the legacy approval/rejection helpers currently have no active controller route and need functional/security review together."
          if old not in text:
              raise SystemExit('ROADMAP mutation item not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('TESTING-1.8.md')
          text = p.read_text(encoding='utf-8')
          anchor = '- Batch continuation/cancellation as owner, another user and administrator.\n'
          addition = anchor + '- Batch continuation/cancellation rejects GET requests and missing/invalid CSRF tokens.\n'
          if anchor in text and 'rejects GET requests and missing/invalid CSRF tokens' not in text:
              text = text.replace(anchor, addition, 1)
          p.write_text(text, encoding='utf-8')
          PY

          php -l public_html/batch.php
          php -l public_html/admin.php
          php -l include/lib-batch.php
          php -l include/batch.php

      - name: Commit hardened mutation paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-final-mutations.yml .github/final-mutation-hardening-trigger
          git add public_html/batch.php public_html/admin.php include/lib-batch.php include/batch.php templates/batch_progress.thtml ROADMAP.md TESTING-1.8.md
          git commit -m 'Harden remaining MediaGallery batch mutations'
          git push origin HEAD:modernize-1.8.0
