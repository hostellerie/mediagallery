name: Harden MediaGallery final mutation paths

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/final-mutation-hardening-trigger'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Apply hardening
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply.py
          python3 /tmp/apply.py
          php -l public_html/batch.php
          php -l public_html/admin.php
          php -l include/lib-batch.php
          php -l include/batch.php
      - name: Commit hardened mutation paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/harden-final-mutations.yml .github/final-mutation-hardening-trigger
          git add public_html/batch.php public_html/admin.php include/lib-batch.php include/batch.php templates/batch_progress.thtml ROADMAP.md
          git commit -m 'Harden remaining MediaGallery batch mutations'
          git push origin HEAD:modernize-1.8.0
