name: Apply MediaGallery PHP 8 legacy cleanup

on:
  push:
    paths:
      - '.github/php83-legacy-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply legacy compatibility fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1, encoding='utf-8'):
              p = Path(path)
              text = p.read_text(encoding=encoding)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count}, found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new), encoding=encoding)

          # JPEG metadata library: each() was removed in PHP 8.0.
          replace('include/lib/JPEG.php',
                  '        reset($EXIFNames);\n        while (list($tag, $name) = each($EXIFNames)) {',
                  '        foreach ($EXIFNames as $tag => $name) {')
          replace('include/lib/JPEG.php',
                  "            reset($this->_info['adobe']['raw']);\n            while (list($key) = each($this->_info['adobe']['raw'])) {",
                  "            foreach (array_keys($this->_info['adobe']['raw']) as $key) {")
          replace('include/lib/JPEG.php',
                  "        reset($this->_info['iptc']);\n\n\n        while (list($label) = each($this->_info['iptc'])) {",
                  "        foreach (array_keys($this->_info['iptc']) as $label) {")
          replace('include/lib/JPEG.php',
                  '        reset($tags2Names);\n        while (list($tag, $name) = each($tags2Names)) {',
                  '        foreach ($tags2Names as $tag => $name) {')

          # Central compatibility helper for old register_globals-era logging.
          common = Path('include/common.php')
          text = common.read_text()
          marker = "function px($var)\n{\n    print_r($var);\n    exit;\n}\n"
          helper = marker + "\nfunction MG_getRemoteAddress()\n{\n    return isset($_SERVER['REMOTE_ADDR']) ? $_SERVER['REMOTE_ADDR'] : '';\n}\n"
          if text.count(marker) != 1:
              raise SystemExit('include/common.php: px() marker not found exactly once')
          common.write_text(text.replace(marker, helper))

          files = [
              'include/sort.php',
              'include/albumedit.php',
              'include/mediamanage.php',
              'include/batch.php',
              'include/lib-watermark.php',
          ]
          total = 0
          for name in files:
              p = Path(name)
              text = p.read_text()
              n = text.count('IP: $REMOTE_ADDR"')
              total += n
              text = text.replace('IP: $REMOTE_ADDR"', 'IP: " . MG_getRemoteAddress()')
              p.write_text(text)
          if total != 23:
              raise SystemExit(f'Expected 23 active $REMOTE_ADDR log uses, found {total}')

          # HTML feed target is otherwise undefined when links stay in the same window.
          replace(
              'include/lib/feedcreator.class.php',
              '\t\t//set an openInNewWindow_token_to be inserted or not\n\t\tif ($this->openInNewWindow) {',
              '\t\t//set an openInNewWindow_token_to be inserted or not\n\t\t$targetInsert = "";\n\t\tif ($this->openInNewWindow) {',
              encoding='latin-1'
          )

      - name: Validate legacy cleanup
        run: |
          if grep -nE '\beach\s*\(' include/lib/JPEG.php; then
            echo 'Active each() remains in JPEG.php' >&2
            exit 1
          fi
          if grep -RIn --include='*.php' --include='*.inc' 'IP: $REMOTE_ADDR' include; then
            echo 'Legacy REMOTE_ADDR log use remains' >&2
            exit 1
          fi
          php -l include/lib/JPEG.php
          php -l include/common.php
          php -l include/sort.php
          php -l include/albumedit.php
          php -l include/mediamanage.php
          php -l include/batch.php
          php -l include/lib-watermark.php
          php -l include/lib/feedcreator.class.php

      - name: Commit cleanup
        run: |
          git config user.name 'hostellerie'
          git config user.email 'hostellerie.org@gmail.com'
          git add include/lib/JPEG.php include/common.php include/sort.php include/albumedit.php include/mediamanage.php include/batch.php include/lib-watermark.php include/lib/feedcreator.class.php
          git commit -m 'Remove PHP 8 blockers from MediaGallery legacy paths'
          git push origin HEAD:modernize-1.8.0
