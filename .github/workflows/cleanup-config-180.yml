name: Cleanup MediaGallery legacy playback config

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/config-cleanup-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/scripts/cleanup-config-180.py
      - name: Remove temporary cleanup files
        run: rm -f .github/scripts/cleanup-config-180.py .github/workflows/cleanup-config-180.yml .github/config-cleanup-trigger
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove obsolete Flash playback configuration'
          git push origin HEAD:modernize-1.8.0
