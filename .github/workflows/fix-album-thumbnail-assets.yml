name: Fix MediaGallery album thumbnail assets

on:
  push:
    paths:
      - '.github/album-thumbnail-assets-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
      - name: Patch album thumbnail fallbacks
        run: python .github/scripts/fix-album-thumbnail-assets.py
      - name: Commit patch and remove one-shot files
        run: |
          rm -f .github/scripts/fix-album-thumbnail-assets.py
          rm -f .github/workflows/fix-album-thumbnail-assets.yml
          rm -f .github/album-thumbnail-assets-trigger
          git add -A
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Use plugin assets for album thumbnail fallbacks [skip ci]"
          git push origin HEAD:modernize-1.8.0
