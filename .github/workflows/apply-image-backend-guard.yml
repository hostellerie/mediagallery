name: Apply MediaGallery image backend guard

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/image-backend-guard-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/image-backend-guard.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l include/lib/imglib/lib-image.php
          grep -q 'MG_getImageBackendStatus180' include/lib/imglib/lib-image.php
          grep -q 'MG_requireImageBackend180' include/lib/imglib/lib-image.php
          grep -q 'PHP GD extension is not loaded' include/lib/imglib/lib-image.php

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/lib/imglib/lib-image.php ROADMAP.md IMPLEMENTATION_NOTES.md
          git commit -m 'Add explicit MediaGallery image backend validation'
          git push origin HEAD:modernize-1.8.0
