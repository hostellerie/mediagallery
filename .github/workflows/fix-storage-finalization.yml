name: Fix MediaGallery storage finalization

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/fix-storage-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Fix upgrade semantics and stray tracing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('autoinstall.php')
          text = p.read_text(encoding='utf-8')

          replacements = {
              'MG_upgrade_1612': '1.6.12',
              'MG_upgrade_170': '1.7.0',
              'MG_upgrade_180': '1.8.0',
          }
          for function, version in replacements.items():
              pattern = re.compile(
                  r"(\$result = " + re.escape(function) + r"\(\);\n\s*if \(\$result != 0\) \{\n)\s*return \$result;\n(\s*\})"
              )
              replacement = (
                  r"\1                COM_errorLog('Media Gallery upgrade failed while migrating to "
                  + version
                  + r".', 1);\n                return 72;\n\2"
              )
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('upgrade-stage return anchor not found: ' + function)

          old = """        return 0;
    }

    DB_query("UPDATE {$_TABLES['plugins']} """
          new = """        return 72;
    }

    DB_query("UPDATE {$_TABLES['plugins']} """
          if old not in text:
              raise SystemExit('final-version failure anchor not found')
          text = text.replace(old, new, 1)

          old = """        COM_errorLog('Media Gallery upgrade: unable to update plugin version metadata.', 1);
        return 0;
    }

    return 1;
"""
          new = """        COM_errorLog('Media Gallery upgrade: unable to update plugin version metadata.', 1);
        return 72;
    }

    return true;
"""
          if old not in text:
              raise SystemExit('top-level success anchor not found')
          text = text.replace(old, new, 1)

          old = "    $mediaRows = isset($_TABLES['mg_media']) ? DB_count($_TABLES['mg_media']) : 0;\n"
          new = """    $localMediaRows = 0;
    if (isset($_TABLES['mg_media'])) {
        $result = DB_query("SELECT COUNT(*) AS local_count FROM {$_TABLES['mg_media']} WHERE remote_media = 0");
        if ($result !== false) {
            $row = DB_fetchArray($result);
            $localMediaRows = isset($row['local_count']) ? (int) $row['local_count'] : 0;
        }
    }
"""
          if old not in text:
              raise SystemExit('mediaRows anchor not found')
          text = text.replace(old, new, 1)
          guard = "if ($mediaRows > 0 && !$legacyHasUserMedia && !$targetHasUserMedia) {"
          if guard not in text:
              raise SystemExit('mediaRows guard not found')
          text = text.replace(
              guard,
              "if ($localMediaRows > 0 && !$legacyHasUserMedia && !$targetHasUserMedia) {",
              1
          )
          p.write_text(text, encoding='utf-8')

          p = Path('include/newmedia.php')
          text = p.read_text(encoding='utf-8')
          old = """    if (!empty($_MG_CONF['verbose'])) {
        COM_errorLog(
            'MG DEBUG saveUserUpload after files: success=' . intval($successfull_upload)
            . ' status_length=' . strlen((string) $statusMsg)
        );
    }

    if ($successfull_upload) {
        if (!empty($_MG_CONF['verbose'])) {
            COM_errorLog('MG DEBUG saveUserUpload before moderator notification');
        }
        MG_notifyModerators180($album_id);
        if (!empty($_MG_CONF['verbose'])) {
            COM_errorLog('MG DEBUG saveUserUpload after moderator notification');
        }
    }
"""
          new = """    if ($successfull_upload) {
        MG_notifyModerators180($album_id);
    }
"""
          if old not in text:
              raise SystemExit('legacy upload debug block not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l autoinstall.php
          php -l include/newmedia.php
          grep -q 'return true;' autoinstall.php
          grep -q 'remote_media = 0' autoinstall.php

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autoinstall.php include/newmedia.php
          git commit -m 'Harden MediaGallery 1.8 storage upgrade semantics'
          git push origin HEAD:modernize-1.8.0
