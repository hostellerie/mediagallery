name: Run MediaGallery video cleanup

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/run-video-cleanup'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/scripts/video-routing-cleanup.py
      - name: Remove temporary cleanup files
        run: rm -f .github/scripts/video-routing-cleanup.py .github/workflows/run-video-cleanup.yml .github/run-video-cleanup
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Route MPEG and MP4 playback through HTML5 renderer'
          git push origin HEAD:modernize-1.8.0
