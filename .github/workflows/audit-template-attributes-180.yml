name: MediaGallery template attribute audit

on:
  push:
    paths:
      - '.github/template-attribute-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Inventory dynamic template attributes
        run: python tools/audit_template_attributes_180.py
