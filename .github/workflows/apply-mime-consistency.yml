name: Apply MediaGallery MIME consistency patch

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/mime-consistency-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/mime-consistency-patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l include/lib-upload.php
          php -l include/upload_security_180.php
          grep -q 'MG_detectLocalMime180' include/lib-upload.php
          grep -q 'MG_validateMimeExtension180' include/lib-upload.php
          grep -q 'rejected MIME/extension mismatch' include/lib-upload.php

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/lib-upload.php ROADMAP.md IMPLEMENTATION_NOTES.md
          git commit -m 'Harden MediaGallery MIME consistency checks'
          git push origin HEAD:modernize-1.8.0
