name: Audit MediaGallery final mutation paths

on:
  workflow_dispatch:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/final-mutation-audit-trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: modernize-1.8.0
      - name: Locate remaining mutation paths
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MG_endSession callers ==='
          grep -RIn --exclude-dir=.git 'MG_endSession' . || true
          echo '=== Caption save/render references ==='
          grep -RIn --exclude-dir=.git -E 'MG_batchCaptionSave|save_exit|media_title\[\]|media_desc\[\]|name="media_title|name="media_desc' . || true
          echo '=== Moderation references ==='
          grep -RIn --exclude-dir=.git -E 'MG_mediaQueue|mediaqueue|moderate|approve|batch_process' include public_html templates | head -n 300 || true
          echo '=== Session progress/cancel ==='
          grep -RIn --exclude-dir=.git -E 'batch_progress|session_id|name="sid"' include public_html templates | head -n 250 || true
