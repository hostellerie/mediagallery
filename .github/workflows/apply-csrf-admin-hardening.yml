name: Apply MediaGallery admin CSRF hardening

on:
  push:
    branches:
      - modernize-1.8.0
    paths:
      - '.github/csrf-admin-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize-1.8.0
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/csrf-admin-patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          php -l include/global.php
          php -l include/lib-watermark.php
          grep -q "global album permission update rejected because of an invalid CSRF token" include/global.php
          grep -q "global album attribute update rejected because of an invalid CSRF token" include/global.php
          grep -q "watermark upload rejected because of an invalid CSRF token" include/lib-watermark.php
          grep -q 'name="{gltoken_name}" value="{gltoken}"' templates/global_album_perm.thtml
          grep -q 'name="{gltoken_name}" value="{gltoken}"' templates/global_album_attr.thtml
          grep -q 'name="{gltoken_name}" value="{gltoken}"' templates/wm_manage.thtml
          grep -q 'name="{gltoken_name}" value="{gltoken}"' templates/wm_upload.thtml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/global.php include/lib-watermark.php templates/global_album_perm.thtml templates/global_album_attr.thtml templates/wm_manage.thtml templates/wm_upload.thtml ROADMAP.md IMPLEMENTATION_NOTES.md
          git commit -m 'Harden MediaGallery admin mutations with CSRF tokens'
          git push origin HEAD:modernize-1.8.0
